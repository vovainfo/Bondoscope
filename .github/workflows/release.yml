name: Android release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: apk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and sign APK
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: apk-release
    outputs:
      artifact-id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release ref
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -nE 's/^[[:space:]]*versionName = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' app/build.gradle.kts)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a release version in app/build.gradle.kts' >&2
            exit 1
          fi
          if [[ "$EVENT" == push ]]; then
            if [[ "$REF_NAME" != "v$version" ]]; then
              echo "Tag $REF_NAME does not match app version v$version" >&2
              exit 1
            fi
            git merge-base --is-ancestor HEAD origin/main || {
              echo 'The release tag must point to a commit on main' >&2
              exit 1
            }
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        run: |
          if [[ ! -x "$ANDROID_HOME/build-tools/36.1.0/apksigner" || ! -d "$ANDROID_HOME/platforms/android-36" ]]; then
            sdkmanager --install 'platforms;android-36' 'build-tools;36.1.0'
          fi

      - name: Run unit tests and assemble release
        run: ./gradlew --no-daemon --max-workers=1 :app:testDebugUnitTest :app:assembleRelease

      - name: Sign, verify and prepare APK
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
        run: bash .github/scripts/package-apk.sh

      - name: Upload signed APK and manifest
        id: bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bondoscope-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bondoscope-release/*.apk
            ${{ runner.temp }}/bondoscope-release/bondoscope-update.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
          merge-multiple: true

      - name: Publish and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          apk="release/Bondoscope-${TAG#v}.apk"
          manifest="release/bondoscope-update.json"
          files=("$apk" "$manifest")
          for file in "${files[@]}"; do
            test -s "$file"
          done

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "Бондоскоп ${TAG#v}" --generate-notes
          fi
          draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
          for file in "${files[@]}"; do
            name=$(basename "$file")
            digest="sha256:$(sha256sum "$file" | cut -d ' ' -f 1)"
            assets=$(gh release view "$TAG" --json assets)
            asset=$(jq -c --arg name "$name" '.assets[] | select(.name == $name)' <<< "$assets")
            if [[ -z "$asset" && "$draft" == true ]]; then
              gh release upload "$TAG" "$file"
              assets=$(gh release view "$TAG" --json assets)
              asset=$(jq -c --arg name "$name" '.assets[] | select(.name == $name)' <<< "$assets")
            fi
            if [[ -z "$asset" ]] || ! jq -e --arg digest "$digest" '.state == "uploaded" and .digest == $digest' <<< "$asset" >/dev/null; then
              echo "GitHub asset does not match the build: $name" >&2
              exit 1
            fi
          done
          if [[ "$draft" == true ]]; then
            gh release edit "$TAG" --draft=false --latest
          fi
          gh release view "$TAG" --json isDraft,url --jq 'if .isDraft then error("Release is still a draft") else .url end'
